<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisah Nabi Musa AS &amp; Firaun</title>
<style>
  :root { --bg: #120b06; --panel: #1f140b; --ink: #f6e7c8; --accent: #e0a93a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  .stage { position: relative; width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  canvas { width: 100%; height: 100%; display: block; }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.45); border: 0; color: var(--ink); cursor: pointer; font-size: clamp(16px, 2.4vw, 28px); }
  .start span { background: var(--accent); color: #2a1a08; padding: .6em 1.4em; border-radius: 999px; font-weight: 700; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; width: min(100%, calc((100vh - 110px) * 16 / 9)); }
  .bar button { background: var(--panel); color: var(--ink); border: 1px solid #4a3420; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .bar input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  .bar label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 90px; }
  body.render { padding: 0; gap: 0; background: #000; }
  body.render .bar, body.render .start { display: none; }
  body.render .stage { width: 1920px; height: 1080px; border-radius: 0; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <button class="start" id="start"><span>▶ Mainkan</span></button>
</div>
<div class="bar">
  <button id="play">▶</button>
  <button id="restart">⟲</button>
  <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Kedudukan">
  <span class="time" id="time">0:00 / 1:00</span>
</div>
<audio id="music" src="soundtrack.m4a" preload="auto"></audio>
<script src="film.js"></script>
<script>
(async function () {
  const F = window.MusaFilm;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const params = new URLSearchParams(location.search);
  await F.load('assets/');

  // Deterministic frame hook used by tools/render.mjs
  if (params.has('render')) {
    document.body.classList.add('render');
    window.renderAt = (t) => { F.render(ctx, t); return true; };
    window.filmReady = true;
    return;
  }

  const music = document.getElementById('music');
  const playBtn = document.getElementById('play');
  const seek = document.getElementById('seek');
  const timeEl = document.getElementById('time');
  seek.max = F.DURATION;

  // Narration, music and SFX are all in soundtrack.m4a.

  // --- clock: follow the soundtrack when it is available
  let playing = false, clock = 0, last = 0, hasAudio = true;
  music.addEventListener('error', () => { hasAudio = false; });
  const now = () => (hasAudio && !music.paused ? music.currentTime : clock);

  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? '❚❚' : '▶';
    document.getElementById('start').style.display = p ? 'none' : '';
    if (p) {
      if (clock >= F.DURATION - 0.05) clock = 0;
      if (hasAudio) { music.currentTime = clock; music.play().catch(() => { hasAudio = false; }); }
      last = performance.now();
    } else {
      clock = now();
      music.pause();
    }
  }
  function seekTo(t) {
    clock = t;
    if (hasAudio) music.currentTime = t;
  }

  function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
  function frame(ts) {
    if (playing) {
      if (!(hasAudio && !music.paused)) clock += (ts - last) / 1000;
      else clock = music.currentTime;
      last = ts;
      if (clock >= F.DURATION) { clock = F.DURATION; setPlaying(false); }
    }
    const t = clock;
    F.render(ctx, t);
    seek.value = t;
    timeEl.textContent = fmt(t) + ' / ' + fmt(F.DURATION);
    requestAnimationFrame(frame);
  }
  playBtn.onclick = () => setPlaying(!playing);
  document.getElementById('start').onclick = () => setPlaying(true);
  document.getElementById('restart').onclick = () => { seekTo(0); setPlaying(true); };
  seek.oninput = () => seekTo(parseFloat(seek.value));
  if (params.has('t')) clock = parseFloat(params.get('t'));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
